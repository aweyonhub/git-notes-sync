name: ci

on:
  push:
    branches: ['*']
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...

  npm-install:
    # end-to-end check of the npm distribution with the real user command
    # (--install-links=true copies instead of symlinking git deps).
    # Tag runs skip this job: it races the publish job (assets get deleted and
    # re-uploaded → download 404 window); plain pushes are stable.
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24' # npm 11: allow-scripts gates install scripts
      - name: npm install -g from github (real user command)
        run: |
          # install-links=true: git deps are symlinked to cacache tmp by default
          # (breaks when tmp dir is cleaned); foreground-scripts avoids reify race
          for i in 1 2 3; do
            npm install -g --install-links=true --foreground-scripts --allow-scripts=git-notes-sync github:aweyonhub/git-notes-sync && break
            echo "attempt $i failed (asset refresh window?), retrying in 20s..."
            sleep 20
          done
          gns --version
          gns help | head -3
          npm ls -g --depth=0 | grep git-notes-sync

  build:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64, ext: '' }
          - { goos: linux, goarch: arm64, ext: '' }
          - { goos: darwin, goarch: amd64, ext: '' }
          - { goos: darwin, goarch: arm64, ext: '' }
          - { goos: windows, goarch: amd64, ext: '.exe' }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build
        run: |
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -ldflags "-s -w \
              -X github.com/aweyonhub/git-notes-sync/internal/version.Version=${GITHUB_REF_NAME#v} \
              -X github.com/aweyonhub/git-notes-sync/internal/version.Commit=${GITHUB_SHA::7}" \
            -o dist/gns-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} ./cmd/gns
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gns-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: cd dist && sha256sum * | sed 's|  dist/|  |' > checksums.txt && cat checksums.txt
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
