name: ci

on:
  push:
    branches: ['*']
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...

  npm-install:
    # STOPGAP: verify the platform-split install chain locally (sub-package tgz
    # + meta tgz) without the npm registry — sub-packages aren't published yet.
    # TODO: once published, switch this to the real e2e:
    #   npm install -g git-notes-sync && gns --version
    # (that covers registry resolution for all platforms).
    # Tag runs skip this job: it races the publish job (assets get deleted and
    # re-uploaded → download 404 window); plain pushes are stable.
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: build linux-x64 binary for sub-package
        run: |
          # packages/cli-linux-x64/bin/ is gitignored (assemble artifact), so
          # build it here — npm pack would TAR_ENTRY_ERROR on a missing bin dir.
          mkdir -p packages/cli-linux-x64/bin
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags "-s -w \
              -X github.com/aweyonhub/git-notes-sync/internal/version.Version=$(node -p 'require("./package.json").version') \
              -X github.com/aweyonhub/git-notes-sync/internal/version.Commit=${GITHUB_SHA::7}" \
            -o packages/cli-linux-x64/bin/gns ./cmd/gns
      - name: local tgz install (registry-free e2e)
        run: |
          # sub-pkg tgz first so the meta package's optionalDependency is
          # satisfied locally; install meta last. Separate dirs avoid the
          # sub-pkg tgz matching git-notes-sync-*.tgz (scoped @ flattens to -).
          mkdir -p /tmp/pkgs/sub /tmp/pkgs/meta
          (cd packages/cli-linux-x64 && npm pack --pack-destination /tmp/pkgs/sub)
          npm pack --pack-destination /tmp/pkgs/meta
          npm install -g /tmp/pkgs/sub/git-notes-sync-*.tgz
          npm install -g /tmp/pkgs/meta/git-notes-sync-*.tgz
          gns --version
          gns help | head -3
          npm ls -g --depth=0 | grep git-notes-sync

  build:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64, ext: '' }
          - { goos: linux, goarch: arm64, ext: '' }
          - { goos: darwin, goarch: amd64, ext: '' }
          - { goos: darwin, goarch: arm64, ext: '' }
          - { goos: windows, goarch: amd64, ext: '.exe' }
          - { goos: windows, goarch: arm64, ext: '.exe' }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build
        run: |
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -ldflags "-s -w \
              -X github.com/aweyonhub/git-notes-sync/internal/version.Version=${GITHUB_REF_NAME#v} \
              -X github.com/aweyonhub/git-notes-sync/internal/version.Commit=${GITHUB_SHA::7}" \
            -o dist/gns-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} ./cmd/gns
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gns-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: cd dist && sha256sum * | sed 's|  dist/|  |' > checksums.txt && cat checksums.txt
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
