# git-notes-sync 配置示例。
# 推荐：放入全局配置（macOS: ~/Library/Application Support/git-notes-sync/config.toml；
#       Linux: ~/.config/git-notes-sync/config.toml；Windows: %APPDATA%\git-notes-sync\config.toml），
#       配合 `gns repos add` 维护多仓库，无需在每个项目中放置配置。
# 自定义位置：设 GNS_CONFIG 环境变量（如 export GNS_CONFIG=~/my-config.toml）。
# 可选：仓库根 ./.notes-sync.toml 作为单仓库覆盖（一般没必要）。
# 每个字段均可省略（使用内置默认值）。

# ---- auto commit -----------------------------------------------------
auto_commit = true            # commit worktree changes before syncing
commit_debounce = 60          # skip commit while the newest change is younger
                              # than N seconds (avoids interrupting edits)
commit_max_wait = 300         # force commit N seconds after a change was first
                              # seen, even if the file keeps changing
                              # (values < commit_debounce are clamped to it)

# 提交信息模式（三种模式均附带 git diff 摘要：文件列表 + 行数增减）：
#   timestamp — 首行时间戳，可追溯，默认：
#       notes: 2026-08-13 11:30
#
#        files: 3 changed, +42, -8
#        - docroot/10-note/mac/aerospace.md (+20, -3)
#        - docroot/20-collect/draft.md (+7)
#   static    — 首行固定文本（commit_static_message），适合脚本过滤/稳定搜索：
#       notes: auto sync
#
#        files: 3 changed, +42, -8
#        - docroot/10-note/mac/aerospace.md (+20, -3)
#   ai        — AI 根据 diff 生成语义化信息（需配置 [ai]），失败自动降级
#               ai_fallback
commit_message = "timestamp"  # timestamp | static | ai
commit_static_message = "notes: auto sync"   # 仅 static 模式生效

# ---- conflicts --------------------------------------------------------
binary_strategy = "ours"      # ours (keep local copy) | abort (stop sync)

[conflict]
strategy = "preserve"         # preserve (keep markers + merge commit) | abort
text_extensions = [".md", ".markdown", ".txt"]   # 视为文本的扩展名

# ---- ai (optional; failures always fall back, never block sync) --------
ai_fallback = "timestamp"     # timestamp | static

[ai]
# api mode: any OpenAI-compatible endpoint
type = "api"
base_url = "https://api.example.com/v1"
model = "model-name"
api_key_env = "NOTES_AI_API_KEY"   # key read from this environment variable
# command mode: any CLI, stdin = diff / conflicted file, stdout = result;
#               when system instructions / AGENTS.md exist, stdin is wrapped
#               as "### Instructions" + "### Input" sections
# type = "command"
# command = "codex exec --format openai ..."
timeout = 60                  # seconds
max_diff_bytes = 51200        # cap the diff sent to the AI
agent_file = "AGENTS.md"      # repo-relative agent instructions file, sent
                              # with the diff (default AGENTS.md; missing = ignored)

# ---- daemon (global config only) ---------------------------------------
sync_interval = 600           # seconds between ticks (default 600 = 10min; min 5s,
                              # smaller values are clamped to 5); also the default
                              # interval for `gns install` (explicit -interval wins)
retry_attempts = 3            # fetch/push retries (exponential backoff;
                              # values < 1 are clamped to 1)
git_timeout = 120             # per git command deadline, seconds (0 = no
                              # timeout, not recommended; 1-4 clamp to 5)

# 多仓库列表（daemon / gns sync-all 使用；两种写法等价）：
# 写法一：简单数组（显示名 = 路径）
# repos = ["~/notes", "~/work/wiki"]
# 写法二：命名表（可用 gns repos add/del 维护）
[[repos]]
name = "notes"
path = "~/notes"

[[repos]]
name = "wiki"
path = "~/work/wiki"
